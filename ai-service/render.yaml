services:
  - type: web
    name: agriconnect-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: USE_FALLBACK_DATA
        value: "false"
      - key: USE_DEV_AUTH
        value: "true"
      - key: SUPABASE_URL
        value: "https://zleagunbdneqeofvmuth.supabase.co"
      - key: FRONTEND_URL
        value: "http://localhost:4321"
